name: GitHub Actions VNC Desktop
on: workflow_dispatch

jobs:
  vnc-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 延长到6小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 安装 Python 3.10 ==========
      - name: Setup Python 3.10
        run: |
          python3 --version
          python3 -m pip install --upgrade "pip==21.3.1"

      # ========== 2. 安装桌面环境 ==========
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openbox obconf \
            lxpanel pcmanfm \
            xterm \
            tigervnc-standalone-server \
            xfonts-base xfonts-75dpi xfonts-100dpi \
            fontconfig \
            autocutsel \
            curl wget

      # ========== 3. 配置 VNC ==========
      - name: Setup VNC
        run: |
          mkdir -p ~/.vnc
          echo "github" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          touch ~/.Xauthority

      # ========== 4. 启动 bore.pub 隧道（独立运行）==========
      - name: Start bore tunnel
        run: |
          curl -sL https://api.github.com/repos/ekzhang/bore/releases/latest | \
            grep "browser_download_url.*x86_64-unknown-linux-musl" | \
            cut -d '"' -f 4 | wget -i - -O bore.tar.gz
          tar -xzf bore.tar.gz
          chmod +x bore
          
          # bore 单独后台运行，不依赖 VNC 状态
          nohup ./bore local 5901 --to bore.pub > bore.log 2>&1 &
          sleep 3

      # ========== 5. 启动看门狗（自动重启 VNC + 桌面）==========
      - name: Start watchdog for VNC and Desktop
        run: |
          cat > /tmp/watchdog.sh << 'EOF'
          #!/bin/bash
          
          VNC_DISPLAY=":1"
          BORE_LOG="/home/runner/work/actions-vnc/bore.log"
          
          start_vnc() {
              echo "[Watchdog] 启动 VNC Server..."
              vncserver -kill $VNC_DISPLAY 2>/dev/null || true
              rm -f /tmp/.X1-lock /tmp/.X11-unix/X1
              vncserver $VNC_DISPLAY -geometry 1280x720 -depth 24 -localhost no -xstartup /usr/bin/openbox-session
              sleep 2
          }
          
          start_desktop_components() {
              echo "[Watchdog] 启动桌面组件..."
              DISPLAY=$VNC_DISPLAY lxpanel &
              DISPLAY=$VNC_DISPLAY pcmanfm --desktop &
          }
          
          # 初始启动
          start_vnc
          start_desktop_components
          
          # 监控循环
          while true; do
              # 检查 VNC 进程
              if ! pgrep -f "Xvnc.*$VNC_DISPLAY" > /dev/null; then
                  echo "[Watchdog] VNC 未运行，重启中..."
                  start_vnc
                  start_desktop_components
              fi
              
              # 检查桌面组件
              if ! pgrep "lxpanel" > /dev/null; then
                  echo "[Watchdog] lxpanel 未运行，重启..."
                  DISPLAY=$VNC_DISPLAY lxpanel &
              fi
              
              if ! pgrep "pcmanfm" > /dev/null; then
                  echo "[Watchdog] pcmanfm 未运行，重启..."
                  DISPLAY=$VNC_DISPLAY pcmanfm --desktop &
              fi
              
              # 打印连接信息
              BORE_PORT=$(grep -oP 'listening at bore.pub:\K\d+' $BORE_LOG 2>/dev/null | head -1)
              clear
              echo ""
              echo "╔════════════════════════════════════════════════════════════╗"
              echo "║                    🖥️  VNC 连接信息                         ║"
              echo "╠════════════════════════════════════════════════════════════╣"
              if [ -n "$BORE_PORT" ]; then
                echo "║  地址: bore.pub:${BORE_PORT}                                 ║"
              else
                echo "║  地址: 等待 bore 隧道启动中...                            ║"
              fi
              echo "║  密码: github                                              ║"
              echo "╚════════════════════════════════════════════════════════════╝"
              echo ""
              echo "✅ 看门狗运行中，每 15 秒检查一次服务状态"
              echo "🔒 VNC 或桌面组件崩溃后会自动重启"
              echo ""
              
              sleep 15
          done
          EOF
          
          chmod +x /tmp/watchdog.sh
          nohup /tmp/watchdog.sh > watchdog.log 2>&1 &
          sleep 3

      # ========== 6. 启动 tmate（后台模式）==========
      - name: Start tmate in background
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true

      # ========== 7. 保持工作流运行 ==========
      - name: Keep alive
        run: |
          echo "所有服务已启动，看门狗正在监控..."
          echo "SSH 链接在上面步骤已打印"
          echo ""
          
          # 每 30 秒打印一次隧道端口
          while true; do
            BORE_PORT=$(grep -oP 'listening at bore.pub:\K\d+' bore.log 2>/dev/null | head -1)
            echo "[$(date '+%H:%M:%S')] VNC 隧道端口: ${BORE_PORT:-等待中}"
            sleep 30
          done

      # ========== 8. 清理 ==========
      - name: Cleanup
        if: always()
        run: |
          echo "正在清理所有服务..."
          pkill -f watchdog.sh || true
          vncserver -kill :1 2>/dev/null || true
          pkill -f bore || true
          pkill lxpanel pcmanfm || true