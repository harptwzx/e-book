name: GitHub Actions VNC Desktop
on: workflow_dispatch

jobs:
  vnc-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 安装完整桌面依赖 ==========
      - name: Install desktop environment
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-mate-core ubuntu-mate-desktop \
            tigervnc-standalone-server \
            dbus-x11 \
            xfce4-terminal \
            curl wget
          # 清理冲突进程
          sudo pkill -9 Xvnc 2>/dev/null || true

      # ========== 2. 配置 VNC 密码和启动脚本 ==========
      - name: Setup VNC
        run: |
          mkdir -p ~/.vnc
          echo "github" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # 创建稳定的 xstartup
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          
          # 启动 dbus
          dbus-launch --exit-with-session &
          
          # 启动 MATE 桌面
          mate-session &
          
          # 备用终端（如果MATE崩溃）
          xfce4-terminal &
          EOF
          chmod +x ~/.vnc/xstartup

      # ========== 3. 启动 VNC（单次，稳定模式）==========
      - name: Start VNC server
        run: |
          vncserver -kill :1 2>/dev/null || true
          rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          sleep 5
          
          # 验证 VNC 是否运行
          if pgrep -f "Xvnc.*:1" > /dev/null; then
            echo "VNC 启动成功"
          else
            echo "VNC 启动失败"
            exit 1
          fi

      # ========== 4. 启动 bore.pub 隧道 ==========
      - name: Start bore tunnel
        run: |
          curl -sL https://api.github.com/repos/ekzhang/bore/releases/latest | \
            grep "browser_download_url.*x86_64-unknown-linux-musl" | \
            cut -d '"' -f 4 | wget -i - -O bore.tar.gz
          tar -xzf bore.tar.gz
          chmod +x bore
          
          # 保持连接的长运行脚本
          cat > keep_bore.sh << 'KEEP'
          #!/bin/bash
          while true; do
            ./bore local 5901 --to bore.pub > bore.log 2>&1
            echo "bore 断开，5秒后重连..." >> bore.log
            sleep 5
          done
          KEEP
          chmod +x keep_bore.sh
          nohup ./keep_bore.sh > /dev/null 2>&1 &
          sleep 5

      # ========== 5. 监控并自动修复 VNC ==========
      - name: Watchdog for VNC
        run: |
          cat > watchdog.sh << 'WATCH'
          #!/bin/bash
          while true; do
            # 检查 VNC 进程
            if ! pgrep -f "Xvnc.*:1" > /dev/null; then
              echo "[$(date)] VNC 崩溃，重启中..." >> /tmp/vnc_watchdog.log
              vncserver -kill :1 2>/dev/null
              rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
              vncserver :1 -geometry 1280x720 -depth 24 -localhost no
              sleep 5
            fi
            
            # 检查桌面会话
            if ! pgrep "mate-session" > /dev/null && ! pgrep "openbox" > /dev/null; then
              echo "[$(date)] 桌面会话崩溃，重启 VNC..." >> /tmp/vnc_watchdog.log
              vncserver -kill :1 2>/dev/null
              sleep 2
              rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
              vncserver :1 -geometry 1280x720 -depth 24 -localhost no
              sleep 5
            fi
            
            sleep 10
          done
          WATCH
          chmod +x watchdog.sh
          nohup ./watchdog.sh > /dev/null 2>&1 &

      # ========== 6. 获取并打印连接信息 ==========
      - name: Print connection info
        run: |
          # 等待 bore 获取端口
          sleep 8
          BORE_PORT=$(grep -oP 'listening at bore.pub:\K\d+' bore.log 2>/dev/null | head -1)
          
          # 如果还没获取到，等待最多30秒
          for i in {1..6}; do
            if [ -n "$BORE_PORT" ]; then
              break
            fi
            sleep 5
            BORE_PORT=$(grep -oP 'listening at bore.pub:\K\d+' bore.log 2>/dev/null | head -1)
          done
          
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    🖥️  VNC 连接信息                         ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║  地址: bore.pub:${BORE_PORT:-未获取到，请查看日志}          ║"
          echo "║  密码: github                                              ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║  ⚠️  如果连接失败，等待30秒后重试                           ║"
          echo "║  🔄 自动修复机制已启用，崩溃后会自动重启                    ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""

      # ========== 7. 后台 tmate ==========
      - name: Start tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true

      # ========== 8. 持续保活 ==========
      - name: Keep workflow alive
        run: |
          echo "服务运行中，看门狗已启动..."
          echo "每30秒打印一次状态"
          while true; do
            BORE_PORT=$(grep -oP 'listening at bore.pub:\K\d+' bore.log 2>/dev/null | tail -1)
            VNC_STATUS=$(pgrep -f "Xvnc.*:1" > /dev/null && echo "✅ 运行中" || echo "❌ 已崩溃")
            echo "[$(date '+%H:%M:%S')] VNC: $VNC_STATUS | 端口: ${BORE_PORT:-等待中}"
            sleep 30
          done

      # ========== 9. 清理 ==========
      - name: Cleanup
        if: always()
        run: |
          vncserver -kill :1 2>/dev/null || true
          pkill -f bore 2>/dev/null || true
          pkill -f watchdog.sh 2>/dev/null || true